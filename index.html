<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>PHASIA</title>
<style>
  :root { --bg:#14161f; --ink:#e8e2d6; --muted:#9aa0b4; --gold:#cbb078; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    line-height: 1.65;
    font-size: 18px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 96px 24px 96px; }
  h1 { font-weight: 600; letter-spacing: 0.18em; font-size: 34px; margin: 0 0 12px; }
  .tagline { color: var(--muted); font-style: italic; margin: 0 0 8px; font-size: 19px; }
  h2 { font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); margin: 48px 0 12px; font-weight: 600; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { margin: 12px 0; }
  a { color: var(--gold); text-decoration: none; border-bottom: 1px solid rgba(203,176,120,0.35); }
  a:hover { border-bottom-color: var(--gold); }
  p { margin: 0; }
  footer { margin-top: 64px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
  <main class="wrap">
    <h1>PHASIA</h1>
    <p class="tagline">Record affirmations in your own voice and fall asleep hearing yourself.</p>

    <h2>Legal</h2>
    <ul>
      <li><a href="/terms">Terms of Service</a></li>
      <li><a href="/privacy">Privacy Policy</a></li>
      <li><a href="/acceptable-use">Acceptable Use Policy</a></li>
    </ul>

    <h2>Support</h2>
    <p>Questions? Reach us at <a href="mailto:help@dreamphasia.app">help@dreamphasia.app</a></p>

    <footer>Alyssa Lindaas LLC</footer>
  </main>
</body>
</html>
